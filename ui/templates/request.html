{% extends "base.html" %}

{% block content %}
<div class="top-0 z-[60] bg-white shadow-sm py-4 mb-4">
<h1 class="text-2xl font-bold mb-6 text-center">Breakglass Access Requests</h1>
</div>

{% if error %}
  <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
    {{ error }}
  </div>
{% endif %}


<!-- HTMX Table Wrapper -->
<div id="requests-table" hx-target="this" hx-swap="innerHTML">
    {% include "partials/requests_table.html" %}
</div>

<style>
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fadeIn 0.3s ease-out;
}
</style>

<div id="toast-container" class="fixed inset-x-0 top-4 flex justify-center z-50 pointer-events-none"></div>

<div id="modal"></div>

{% endblock %}
