<div id="rotation-jobs-table">
  <table class="min-w-full bg-white border rounded shadow text-sm">
    <thead class="bg-gray-100 border-b">
      <tr>
        <th class="px-3 py-2">Request ID</th>
        <th class="px-3 py-2">Device</th>
        <th class="px-3 py-2">Account</th>
        <th class="px-3 py-2">Status</th>
        <th class="px-3 py-2">Retries</th>
        <th class="px-3 py-2">Last Rotation</th>
        <th class="px-3 py-2">Error</th>
      </tr>
    </thead>

    <tbody>
      {% for j in jobs %}
      <tr class="border-b hover:bg-gray-50">
        <td class="px-3 py-2">{{ j.id }}</td>
        <td class="px-3 py-2">{{ j.device_name }}</td>
        <td class="px-3 py-2">{{ j.account_username }}</td>
        <td class="px-3 py-2">{{ j.rotation_status }}</td>
        <td class="px-3 py-2">{{ j.rotation_retries }}</td>
        <td class="px-3 py-2">{{ j.rotation_at }}</td>
        <td class="px-3 py-2 text-red-600">{{ j.rotation_error }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
