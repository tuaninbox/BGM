<div id="password-modal"
     class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
     hx-on:load="startPasswordModal(this)">
  <div class="bg-white p-6 rounded shadow-lg w-96 text-center" style="height: 300px;">

    <h2 class="text-xl font-bold mb-3">Breakglass Password</h2>

    <p class="text-sm text-gray-600 mb-1">
      <strong>Device:</strong> {{ device }}
    </p>

    <p class="text-sm text-gray-600 mb-4 flex items-center justify-center gap-2">
      <strong>Account:</strong> {{ username }}
      <!-- <button
        class="text-blue-600 hover:text-blue-800"
        onclick="copyWithToast('{{ username }}', 'username')"
        title="Copy Username"> -->
      <button type="button"
        class="ml-2 text-blue-600 hover:text-blue-800"
        onclick="copyUsername('{{ username }}')">  
        📋
      </button>
    </p>

    <p class="text-lg font-mono mb-6 blur-sm hover:blur-none transition duration-300 cursor-pointer flex items-center justify-center gap-2">
      {{ password }}
      <button type="button"
        class="ml-2 text-blue-600 hover:text-blue-800"
        onclick="copyPassword('{{ password }}')">
        📋
      </button>
    </p>
<!-- 
  Fixed-height toast so modal size doesn't jump
    <div id="copy-toast"
         class="text-green-700 text-sm font-semibold mb-3 opacity-0 transition-opacity duration-300"
         style="height: 20px;">
    </div> -->
    <!-- Toast inside modal, above Close button -->
  <div class="relative h-5 mb-3">
    <div id="copy-toast"
        class="absolute inset-0 text-green-700 text-sm font-semibold transition-opacity duration-300"
        style="visibility:hidden; opacity:0;">
    </div>
  </div>

    <button
      class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-800 mx-auto block"
      onclick="document.getElementById('password-modal').remove()">
      Close
    </button>


<!-- 
    <p class="text-xs text-gray-500 mt-3">

    </p>

    <div class="w-full bg-gray-200 h-2 rounded mt-2">
      <div id="pw-progress" class="bg-blue-600 h-2 rounded" style="width: 100%;"></div>
    </div> -->

  </div>
</div>
