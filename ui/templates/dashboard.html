{% extends "base.html" %}

{% block content %}

<div class="w-full px-4">
  <h1 class="text-2xl font-bold mb-6 text-center">Approval Dashboard</h1>

  <!-- Summary cards -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm mb-6">
    <div class="bg-white border rounded shadow p-4">
      <p class="font-semibold text-gray-700">Pending</p>
      <p class="text-2xl font-bold text-yellow-600">{{ stats.pending }}</p>
    </div>
    <div class="bg-white border rounded shadow p-4">
      <p class="font-semibold text-gray-700">Approved</p>
      <p class="text-2xl font-bold text-green-600">{{ stats.approved }}</p>
    </div>
    <div class="bg-white border rounded shadow p-4">
      <p class="font-semibold text-gray-700">Rejected</p>
      <p class="text-2xl font-bold text-red-600">{{ stats.rejected }}</p>
    </div>
    <div class="bg-white border rounded shadow p-4">
      <p class="font-semibold text-gray-700">Expired</p>
      <p class="text-2xl font-bold text-gray-600">{{ stats.expired }}</p>
    </div>
  </div>

  <!-- Filters -->
  <!-- <form
    class="bg-white border rounded shadow p-4 text-sm flex flex-wrap gap-6 items-end mb-6"
    method="get"
    action="/ui/approval/dashboard"
  > -->
<form
    class="bg-white border rounded shadow p-4 text-sm flex flex-wrap gap-6 items-end mb-6"
    hx-get="/ui/approval/dashboard"
    hx-target="#approver-table"
    hx-swap="outerHTML"
    hx-trigger="change, keyup delay:300ms"
>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Device</label>
      <input type="text" name="device" value="{{ device or '' }}" class="border rounded px-2 py-1"
             hx-trigger="keyup changed delay:300ms">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Account</label>
      <input type="text" name="account" value="{{ account or '' }}" class="border rounded px-2 py-1"
             hx-trigger="keyup changed delay:300ms">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Requester</label>
      <input type="text" name="requester" value="{{ requester or '' }}" class="border rounded px-2 py-1"
             hx-trigger="keyup changed delay:300ms">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Approver</label>
      <input type="text" name="approver" value="{{ approver or '' }}" class="border rounded px-2 py-1"
             hx-trigger="keyup changed delay:300ms">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Approval Method</label>
      <select name="method" class="border rounded px-2 py-1" hx-trigger="change">
        <option value="">All</option>
        <option value="direct" {% if method == "direct" %}selected{% endif %}>Direct</option>
        <option value="otp" {% if method == "otp" %}selected{% endif %}>OTP</option>
        <option value="email" {% if method == "email" %}selected{% endif %}>Email</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600">Status</label>
      <select name="status" class="border rounded px-2 py-1" hx-trigger="change">
        <option value="">All</option>
        <option value="pending" {% if status == "pending" %}selected{% endif %}>Pending</option>
        <option value="approved" {% if status == "approved" %}selected{% endif %}>Approved</option>
        <option value="rejected" {% if status == "rejected" %}selected{% endif %}>Rejected</option>
        <option value="expired" {% if status == "expired" %}selected{% endif %}>Expired</option>
      </select>
    </div>

    <!-- <button class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700">
      Filter
    </button> -->
  </form>

  <!-- Table -->
 {% include "partials/approval_table.html" %}
</div>

<div id="modal"></div>

{% endblock %}
