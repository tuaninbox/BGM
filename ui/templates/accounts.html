{% extends "base.html" %}
{% block content %}

<h1 class="text-2xl font-bold mb-6 text-center">Accounts</h1>

<!-- Create Account Button -->
<div class="mt-6 px-4">
  <a href="/ui/accounts/create"
     class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 inline-block">
    Create Account
  </a>
</div>

<!-- Accounts Table -->
<div class="mt-6 px-4">
  <table class="w-full border rounded shadow whitespace-nowrap">
    <thead class="bg-gray-200">
      <tr>
        <th class="px-3 py-2 text-left">Username</th>
        <th class="px-3 py-2 text-left">First Name</th>
        <th class="px-3 py-2 text-left">Last Name</th>
        <th class="px-3 py-2 text-left">Email</th>
        <th class="px-3 py-2 text-left">Role</th>
        <th class="px-3 py-2 text-left">Tenant</th>
        <th class="px-3 py-2 text-left">Source</th>
        <th class="px-3 py-2 text-left">OTP</th>
        <th class="px-3 py-2 text-left">Profiles</th>
        <th class="px-3 py-2 text-left">Actions</th>
      </tr>
    </thead>

    <tbody id="accounts-table">
      {% include "partials/accounts_table.html" %}
    </tbody>
  </table>
</div>

<!-- HTMX Modal Container -->
<div id="modal"></div>

{% endblock %}
