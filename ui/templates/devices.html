{% extends "base.html" %}
{% block content %}

<!-- Sticky Title -->
<div class="top-0 z-[60] bg-white shadow-sm py-4 mb-4">
  <h1 class="text-2xl font-bold text-center">Devices</h1>
</div>

{% if error %}
  <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
    {{ error }}
  </div>
{% endif %}

<!-- HTMX wrapper -->
<div id="devices-table" hx-target="this" hx-swap="innerHTML">
    {% include "partials/devices_table.html" %}
</div>

<div id="modal"></div>

<script src="/static/js/account.js"></script>
<script src="/static/js/device.js"></script>

{% endblock %}
